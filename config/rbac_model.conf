[request_definition]
r = sub, obj, act

[policy_definition]
p = sub, obj, act

[role_definition]
g = _, _

[policy_effect]
e = some(where (p.eft == allow))

[matchers]
m0 = r.sub == p.sub && ParamsMatch(r.obj,p.obj) && r.act == p.act || isSuper(r.sub)
m00 = r.sub == p.sub && keyMatch2(r.obj, p.obj) && regexMatch(r.act, p.act)
m = r.sub == p.sub && r.obj == p.obj && regexMatch(r.act, p.act)